aid: voyager-portal
name: Voyager Portal
description: Voyager Portal is an AI-powered voyage and demurrage management platform
  for bulk commodity charterers, traders, brokers, and manufacturers, streamlining
  maritime shipping workflows from pre-fixture planning through post-fixture claim
  resolution. The platform provides AI-driven demurrage claims management and laytime
  calculations, cargo allocation, AIS vessel tracking, ETA tracking, noon reporting,
  and analytics, and exposes a documented public REST API for managing voyages, cargoes,
  claims, SOFs, vessels, ports, and workflows, plus outbound webhooks.
