apis:
- name: Voyager Portal Public API
  description: REST API for managing voyages and workflows on the Voyager Portal
    maritime operations platform. Resources include voyages (schedules, cargoes,
    documents, categories, models), claims and claim port-calls, statement of facts
    (SOF) upload and parsing, cargoes, companies, groups, datasets, ports, regions,
    vessels, and workflow instances (start, save task, complete task). Authenticated
    with a bearer token issued by the platform token endpoint; results are paginated
    with page and rowsPerPage parameters.
  image: https://www.voyagerportal.com/wp-content/uploads/2025/08/teste-1.png
